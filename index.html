<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Anime Speeches</title>
</head>
<body>

<div class="page">
  <svg class="bg-svg" viewBox="0 0 700 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <rect width="700" height="600" fill="#0d0d14"/>
    <circle cx="350" cy="300" r="260" fill="none" stroke="#1e1a2e" stroke-width="1"/>
    <circle cx="350" cy="300" r="200" fill="none" stroke="#1e1a2e" stroke-width="0.5"/>
    <circle cx="350" cy="300" r="320" fill="none" stroke="#18152a" stroke-width="1"/>
    <circle cx="120" cy="80" r="140" fill="#15102a" opacity="0.7"/>
    <circle cx="580" cy="500" r="120" fill="#130e28" opacity="0.8"/>
    <circle cx="620" cy="100" r="80" fill="#1a1030" opacity="0.5"/>
    <line x1="0" y1="600" x2="700" y2="0" stroke="#221c38" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="700" y2="100" stroke="#1e1830" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="600" y2="0" stroke="#1c1630" stroke-width="0.5"/>
    <polygon points="350,60 370,100 330,100" fill="#534AB7" opacity="0.18"/>
    <polygon points="350,540 370,500 330,500" fill="#534AB7" opacity="0.10"/>
    <polygon points="60,300 100,320 100,280" fill="#3C3489" opacity="0.15"/>
    <polygon points="640,300 600,280 600,320" fill="#3C3489" opacity="0.15"/>
    <circle cx="350" cy="300" r="4" fill="#7F77DD" opacity="0.4"/>
    <circle cx="200" cy="160" r="2" fill="#AFA9EC" opacity="0.5"/>
    <circle cx="500" cy="440" r="2" fill="#AFA9EC" opacity="0.4"/>
    <circle cx="580" cy="140" r="1.5" fill="#AFA9EC" opacity="0.6"/>
    <circle cx="130" cy="420" r="1.5" fill="#AFA9EC" opacity="0.4"/>
    <circle cx="440" cy="80" r="1" fill="#CECBF6" opacity="0.5"/>
    <circle cx="260" cy="500" r="1" fill="#CECBF6" opacity="0.4"/>
    <defs>
      <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0d0d14" stop-opacity="1"/>
        <stop offset="100%" stop-color="#0d0d14" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="botFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0d0d14" stop-opacity="0"/>
        <stop offset="100%" stop-color="#0d0d14" stop-opacity="1"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="700" height="80" fill="url(#topFade)"/>
    <rect x="0" y="520" width="700" height="80" fill="url(#botFade)"/>
  </svg>

  <div class="content">
    <p class="tag">Anime</p>
    <h1 class="title">Iconic <span>speeches</span></h1>
    <p class="sub">Words that moved the world</p>
    <div class="rule"></div>
    <div class="btn-list">
      <a href="ErwinSpeech.html" class="speech-btn">
        <div class="btn-icon icon-e">E</div>
        <div class="btn-text">
          <span class="btn-label">Erwin Smith</span>
          <span class="btn-desc">Attack on Titan · Charge of the Damned</span>
        </div>
        <span class="btn-arrow">→</span>
      </a>
      <a href="MadaraSpeech.html" class="speech-btn">
        <div class="btn-icon icon-m">M</div>
        <div class="btn-text">
          <span class="btn-label">Madara Uchiha</span>
          <span class="btn-desc">Naruto · Wake up to reality</span>
        </div>
        <span class="btn-arrow">→</span>
      </a>
      <a href="PainSpeech.html" class="speech-btn">
        <div class="btn-icon icon-p">P</div>
        <div class="btn-text">
          <span class="btn-label">Pain (Nagato)</span>
          <span class="btn-desc">Naruto · Justice of suffering</span>
        </div>
        <span class="btn-arrow">→</span>
      </a>
    </div>
    <div class="accent-line"></div>
  </div>
</div>

</body>
</html>
