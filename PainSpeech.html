<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pain Speech</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0d0d14;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      font-family: sans-serif;
    }
    .char-bg {
      position: fixed;
      top: 0; right: 0;
      width: 55%;
      height: 100%;
      background: url('pain.jpg') center top / cover no-repeat;
      z-index: 0;
    }
    .char-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, #0d0d14 0%, rgba(13,13,20,0.6) 60%, rgba(13,13,20,0.1) 100%);
    }
    .char-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(13,13,20,0.5) 0%, transparent 30%, transparent 70%, rgba(13,13,20,0.8) 100%);
    }
    .dark-left {
      position: fixed;
      top: 0; left: 0;
      width: 50%;
      height: 100%;
      background: #0d0d14;
      z-index: 0;
    }
    .content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center;
      width: 100%; max-width: 480px;
      padding: 3rem 1.5rem;
    }
    .back-btn {
      align-self: flex-start;
      font-size: 12px; color: #7a718a;
      text-decoration: none;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }
    .back-btn:hover { color: #ede8ff; }
    .char-badge {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 500;
      background: rgba(127,119,221,0.25);
      color: #cec9f6;
      border: 0.5px solid rgba(127,119,221,0.4);
      margin-bottom: 14px;
    }
    .tag { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6b6278; margin-bottom: 6px; }
    .char-name { font-size: 28px; font-weight: 500; color: #f0ecff; margin-bottom: 4px; text-align: center; }
    .char-sub { font-size: 13px; color: #6b6278; margin-bottom: 2.2rem; text-align: center; }
    .divider { width: 1px; height: 28px; background: #2a2040; margin: 0 auto 2.2rem; }
    .media-card {
      width: 100%;
      background: rgba(13,13,20,0.75);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 1.2rem;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }
    .media-label {
      font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: #4a4160;
      margin-bottom: 10px;
    }
    video, audio { width: 100%; border-radius: 8px; display: block; background: #0d0d14; }
    video { max-height: 260px; object-fit: contain; }
    .accent-line { width: 40px; height: 2px; background: #534AB7; border-radius: 2px; margin: 2rem auto 0; }
  </style>
</head>
<body>
  <div class="dark-left"></div>
  <div class="char-bg"></div>
  <div class="content">
    <a href="index.html" class="back-btn">← back to speeches</a>
    <div class="char-badge">P</div>
    <p class="tag">Naruto · Akatsuki</p>
    <h1 class="char-name">Pain (Nagato)</h1>
    <p class="char-sub">Justice of suffering</p>
    <div class="divider"></div>
    <div class="media-card">
      <p class="media-label">Video</p>
      <video autoplay muted controls>
        <source src="video/PainSpeech.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="media-card">
      <p class="media-label">Audio</p>
      <audio autoplay controls>
        <source src="audio/PainSpeech.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>
    <div class="accent-line"></div>
  </div>
</body>
</html>
